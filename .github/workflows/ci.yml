name: CI

on:
    push:
        branches:
            - main
            - 'release/**'
    pull_request:
        branches:
            - main
            - 'release/**'
    workflow_dispatch:

permissions:
    contents: read

# A newer push to a pull request cancels the run it replaces.
concurrency:
    group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
    cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
    quality:
        name: Theme quality checks
        runs-on: ubuntu-latest
        steps:
            - name: Checkout code
              uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
              with:
                  persist-credentials: false

            - name: Install PHP
              uses: shivammathur/setup-php@f3e473d116dcccaddc5834248c87452386958240 # 2.37.2
              with:
                  php-version: '8.3'
                  coverage: none
                  tools: composer:v2

            - name: Check release source
              run: node tests/release-check.mjs

            - name: Check block markup
              run: node tests/markup-check.mjs

            - name: Check 1.x compatibility contract
              run: node tests/compat-check.mjs

            - name: Check the 2.x public API
              run: node tests/api-check.mjs

            - name: Check PHP syntax
              run: find . -type f -name '*.php' -not -path './vendor/*' -not -path './node_modules/*' -print0 | xargs -0 -n1 php -l

            - name: Install Composer dependencies
              run: composer install --no-interaction --no-progress --prefer-dist

            - name: Run WordPress coding standards
              run: vendor/bin/phpcs .

            - name: Check the release package
              run: bash tests/release-package-check.sh

    changes:
        # Which browser checks to run. Pull requests into a release branch get only the
        # quality checks; the browser checks run after each merge into it, on pull requests
        # to main and on demand (Run workflow). They skip changes to docs alone, and the
        # editor check runs only when something it opens could have changed.
        name: Pick the site checks
        runs-on: ubuntu-latest
        outputs:
            groups: ${{ steps.pick.outputs.groups }}
        steps:
            - name: Checkout code
              uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
              with:
                  fetch-depth: 0
                  persist-credentials: false

            - name: Pick the site checks
              id: pick
              env:
                  EVENT: ${{ github.event_name }}
                  BASE_REF: ${{ github.base_ref }}
                  BEFORE: ${{ github.event.pull_request.base.sha || github.event.before }}
                  AFTER: ${{ github.event.pull_request.head.sha || github.sha }}
              run: |
                  if [ "$EVENT" = pull_request ] && [ "$BASE_REF" != main ]; then
                      reason="a pull request into $BASE_REF: they run after the merge"
                      groups='[]'
                  elif [ "$EVENT" = workflow_dispatch ] || ! changed=$(git diff --name-only "$BEFORE...$AFTER" 2> /dev/null); then
                      reason="$EVENT: every check"
                      groups='["pages","styles","editor"]'
                  else
                      # Files no browser check reads: docs, translations, and what only the quality checks use.
                      unread='\.(md|txt)$|^screenshot\.png$|^languages/|^\.impeccable/|^\.github/(review/|workflows/claude)|^(composer\.(json|lock)|phpcs\.xml\.dist|\.editorconfig|\.gitignore|\.gitattributes)$|^tests/((release|markup|compat|api)-check\.mjs|release-package-check\.sh)$|^bin/(build-release\.sh|freeze-api\.mjs)$'
                      # Files the editor check opens, or that run it.
                      opened='^(patterns|templates|parts|styles)/|^theme\.json$|\.php$|^bin/check-(editor\.mjs|site\.sh)$|^package(-lock)?\.json$|^\.github/workflows/ci\.yml$'
                      site=$(grep -vE "$unread" <<< "$changed" || true)
                      editor=$(grep -E "$opened" <<< "$site" || true)
                      if [ -z "$site" ]; then
                          reason='only docs or files the quality checks use'
                          groups='[]'
                      elif [ -z "$editor" ]; then
                          reason='nothing the editor check opens changed'
                          groups='["pages","styles"]'
                      else
                          reason='site files changed'
                          groups='["pages","styles","editor"]'
                      fi
                  fi
                  echo "groups=$groups" >> "$GITHUB_OUTPUT"
                  echo "Site checks: $groups ($reason)" | tee -a "$GITHUB_STEP_SUMMARY"

    site:
        # A fresh WordPress with test content, built where the local DDEV site keeps the
        # theme (wp-content/themes/agile-base), so bin/check-site.sh runs unchanged.
        name: Site checks # GitHub adds the group: Site checks (pages)
        needs: changes
        if: needs.changes.outputs.groups != '[]'
        runs-on: ubuntu-latest
        timeout-minutes: 45
        strategy:
            fail-fast: false
            matrix:
                group: ${{ fromJSON(needs.changes.outputs.groups) }}
        env:
            WP_URL: http://127.0.0.1:8080
            WP_CLI: wp
        defaults:
            run:
                working-directory: site/wp-content/themes/agile-base
        steps:
            - name: Checkout code
              uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
              with:
                  path: site/wp-content/themes/agile-base
                  fetch-depth: 0 # the 1.x content check reads the 1.4.1 tag
                  persist-credentials: false

            - name: Install PHP
              uses: shivammathur/setup-php@f3e473d116dcccaddc5834248c87452386958240 # 2.37.2
              with:
                  php-version: '8.4'
                  coverage: none
                  extensions: mysqli, gd
                  tools: wp-cli

            - name: Install Node
              uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
              with:
                  node-version: 22
                  cache: npm
                  cache-dependency-path: site/wp-content/themes/agile-base/package-lock.json

            - name: Install Playwright
              run: |
                  npm ci
                  npx playwright install --with-deps chromium

            - name: Install WordPress
              run: |
                  sudo systemctl start mysql.service
                  wp core download --path=../../.. --skip-content
                  wp config create --dbname=wordpress --dbuser=root --dbpass=root --dbhost=127.0.0.1 --extra-php <<< "define( 'WP_DEBUG', true );"
                  wp db create
                  wp core install --url="$WP_URL" --title='Agile Base' --admin_user=admin --admin_password=admin --admin_email=admin@example.com --skip-email
                  wp theme activate agile-base
                  wp rewrite structure '/%year%/%monthnum%/%day%/%postname%/'

            - name: Add test content
              # Enough posts to paginate, categories, tags, featured images and comments.
              run: |
                  photo=$(wp media import assets/images/placeholder-photo.webp --title='Test: photo' --porcelain)
                  categories=()
                  for name in News Guides 'Case studies'; do
                      categories+=("$(wp term create category "$name" --porcelain)")
                  done
                  body='<!-- wp:paragraph --><p>A short opening paragraph with <a href="#more">a link</a>, so the post has some text to read.</p><!-- /wp:paragraph --><!-- wp:heading --><h2 class="wp-block-heading" id="more">A section heading</h2><!-- /wp:heading --><!-- wp:list --><ul class="wp-block-list"><!-- wp:list-item --><li>First point</li><!-- /wp:list-item --><!-- wp:list-item --><li>Second point</li><!-- /wp:list-item --></ul><!-- /wp:list --><!-- wp:quote --><blockquote class="wp-block-quote"><!-- wp:paragraph --><p>A quotation to set apart.</p><!-- /wp:paragraph --></blockquote><!-- /wp:quote -->'
                  wp post update 1 --post_date='2026-01-01 08:00:00'
                  for i in $(seq 1 11); do
                      id=$(wp post create --post_status=publish --post_author=1 --post_title="Test: post $i" --post_excerpt="A one-line summary of test post $i." --post_content="$body" --post_category="${categories[i % 3]}" --tags_input=checks --post_date="2026-01-$(printf %02d "$((i + 1))") 09:00:00" --porcelain)
                      if [ $((i % 2)) -eq 1 ]; then wp post meta set "$id" _thumbnail_id "$photo"; fi
                  done
                  wp comment create --comment_post_ID="$id" --comment_author='Test: commenter' --comment_content='A reply, so the comment list renders.' --comment_approved=1

            - name: Start WordPress
              run: |
                  PHP_CLI_SERVER_WORKERS=8 nohup wp server --host=127.0.0.1 --port=8080 > "$RUNNER_TEMP/server.log" 2>&1 &
                  timeout 60 bash -c 'until curl -fsS -o /dev/null "$WP_URL/"; do sleep 1; done'

            - name: Run the site checks
              env:
                  GROUP: ${{ matrix.group }}
              run: bash bin/check-site.sh "$GROUP"

            - name: Show the server log
              if: failure()
              run: tail -n 200 "$RUNNER_TEMP/server.log"

            - name: Upload screenshots
              if: always()
              uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
              with:
                  name: screenshots-${{ matrix.group }}
                  path: site/wp-content/themes/agile-base/build/checks/
                  retention-days: 7
                  if-no-files-found: ignore
