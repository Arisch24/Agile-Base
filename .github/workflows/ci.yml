name: CI

on:
    push:
        branches:
            - main
    pull_request:
        branches:
            - main

permissions:
    contents: read

jobs:
    quality:
        name: Theme quality checks
        runs-on: ubuntu-latest
        steps:
            - name: Checkout code
              uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
              with:
                  persist-credentials: false

            - name: Install PHP
              uses: shivammathur/setup-php@f3e473d116dcccaddc5834248c87452386958240 # 2.37.2
              with:
                  php-version: '8.3'
                  coverage: none
                  tools: composer:v2

            - name: Check release source
              run: node tests/release-check.mjs

            - name: Check PHP syntax
              run: find . -type f -name '*.php' -not -path './vendor/*' -not -path './node_modules/*' -print0 | xargs -0 -n1 php -l

            - name: Install Composer dependencies
              run: composer install --no-interaction --no-progress --prefer-dist

            - name: Run WordPress coding standards
              run: vendor/bin/phpcs .
