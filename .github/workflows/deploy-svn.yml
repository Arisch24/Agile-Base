name: Deploy to WordPress.org

# Mirrors the trigger convention from 10up/action-wordpress-plugin-deploy's
# "deploy on pushing a new tag" example: push a plain version tag (no "v"
# prefix, e.g. "1.0.1", matching style.css/readme.txt) and this ships it.
on:
    push:
        tags:
            - "*"
    # Manual trigger, defaulting to a dry run -- lets you verify the SVN
    # checkout, credentials, and file sync from the Actions tab before ever
    # pushing a real tag. Run this first.
    workflow_dispatch:
        inputs:
            dry_run:
                description: "Dry run (do not commit to SVN)"
                type: boolean
                default: true
            version:
                description: "Version to deploy (defaults to style.css's Version when triggered manually)"
                type: string
                default: ""

permissions:
    contents: read

jobs:
    deploy:
        name: SVN deploy
        runs-on: ubuntu-latest
        steps:
            - name: Checkout code
              uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

            - name: Deploy to themes.svn.wordpress.org
              env:
                  SVN_USERNAME: ${{ secrets.WPORG_SVN_USERNAME }}
                  SVN_PASSWORD: ${{ secrets.WPORG_SVN_PASSWORD }}
              run: |
                  args=("${{ inputs.version }}")
                  if [ "${{ inputs.dry_run }}" = "true" ]; then
                    args+=("--dry-run")
                  fi
                  bash bin/deploy-svn.sh "${args[@]}"
